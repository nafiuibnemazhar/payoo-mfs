<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Payoo MFS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="flex justify-center">
      <div class="mockup-phone bg-amber-50">
        <div class="mockup-phone-camera"></div>
        <div class="mockup-phone-display grid place-content-center">
          <!-- available balance start -->
          <div class="stats shadow">
            <div class="stat text-center">
              <div id="account-balance" class="stat-value">89400</div>
              <div class="stat-desc">Available balance</div>
            </div>
          </div>
          <div class="divider"></div>
          <!-- available balance end -->
          <!-- User action button start -->
          <div class="flex gap-2">
            <button class="btn btn-outline">Add money</button>
            <button class="btn btn-outline btn-primary">Cash out</button>
          </div>
          <!-- User action button end -->
          <div class="divider"></div>
          <!-- add money form start -->
          <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label">Amount</label>
                <input
                  id="input-add-money"
                  type="email"
                  class="input"
                  placeholder="Please enter amount"
                />
                <label class="label">Pin</label>
                <input
                  id="input-pin-number"
                  type="password"
                  class="input"
                  autocomplete="off"
                  placeholder="Please enter your pin"
                />
                <button id="btn-add-money" class="btn btn-neutral mt-4">
                  Add money
                </button>
              </fieldset>
            </div>
          </div>
          <!-- add money form end -->
        </div>
      </div>
    </main>
    <script src="js/home.js"></script>
  </body>
</html>
